apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-hello-deployment
  labels:
    app: flask-hello
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-hello
      tier: frontend
  template:
    metadata:
      labels:
        app: flask-hello
        tier: frontend
    spec:
      containers:
        - name: flask-hello
          image: keshavagrawal2006/flask-devops-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
